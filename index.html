<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolão Amigos BJ - Fechamento 8 Jogos</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 20px; background-color: var(--bg); color: var(--text); }
    .container { max-width: 1150px; margin: 0 auto; }
    h1 { margin: 0 0 5px 0; font-size: 1.6rem; color: var(--primary); }
    p.subtitle { margin: 0 0 20px 0; color: var(--muted); font-size: 0.95rem; }

    .grid-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 1.15rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }

    input[type="text"], input[type="number"], select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.9rem;
    }

    input[type="text"] { width: 100%; }
    input[type="number"] { width: 65px; text-align: center; }

    select.letra-select { font-weight: bold; width: 58px; text-align: center; cursor: pointer; }
    .letra-A { background: #166534 !important; color: #fff; }
    .letra-B { background: #1d4ed8 !important; color: #fff; }
    .letra-C { background: #b45309 !important; color: #fff; }
    .letra-D { background: #991b1b !important; color: #fff; }
    .letra-S { background: #000000 !important; color: #facc15; border-color: #facc15; }
    .letra-OFF { background: #334155 !important; color: #94a3b8; }

    .badge-tipo {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      background: #334155;
    }

    .filtros-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .filtro-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    button {
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-primary { background: var(--primary); color: #052e16; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: #2563eb; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #334155; }

    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .stat-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-box span { display: block; font-size: 0.78rem; color: var(--muted); }
    .stat-box strong { font-size: 1.25rem; color: var(--primary); }

    .blocos-lista { max-height: 180px; overflow-y: auto; margin-top: 10px; }
    .bloco-card {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }

    textarea {
      width: 100%;
      height: 240px;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
    }
  </style>
</head>
<body>

    <h1>Bolão Amigos BJ — Fechamento por Letras (8 Jogos)</h1>
    <p class="subtitle">Classifique as colunas por potencial (A, B, C, D, S), aplique filtros de cota e some sub-blocos para fechar seu bolão.</p>

              <td><input type="text" id="visitante_2" placeholder="Time Fora 2"></td>

            <tr>

              <td><select id="j_3_c_0" class="letra-select letra-OFF" onchange="atualizarEstiloSelect(this, 3)"><option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="S">S</option></select></td>
              <td><select id="j_3_c_1" class="letra-select letra-OFF" onchange="atualizarEstiloSelect(this, 3)"><option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="S">S</option></select></td>
              <td><select id="j_3_c_2" class="letra-select letra-OFF" onchange="atualizarEstiloSelect(this, 3)"><option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="S">S</option></select></td>
              <td><input type="text" id="visitante_3" placeholder="Time Fora 3"></td>

              <td><select id="j_4_c_0" class="letra-select letra-OFF" onchange="atualizarEstiloSelect(this, 4)"><option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="S">S</option></select></td>
